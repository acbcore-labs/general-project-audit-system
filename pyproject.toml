[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auditos"
version = "1.0.0"
description = "Generalized SQLite-backed multi-agent codebase and project auditing system with CLI and Web UI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
audit = "audit_cli:main"

[tool.setuptools]
py-modules = ["audit_db", "audit_cli", "audit_server"]
